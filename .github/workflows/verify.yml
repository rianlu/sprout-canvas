name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    # Pinned like the Docker base image, so a runner OS upgrade is a deliberate edit instead of a silent move of ubuntu-latest.
    runs-on: ubuntu-26.04
    env:
      SPROUT_TEST_OUTPUT: /tmp/sprout-browser-check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: docker build -t sprout-canvas:verify .
      - run: npm run test:docker
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-verification
          path: /tmp/sprout-browser-check
