      <circle cx="13" cy="44" r="1" fill="#c8b894" opacity="0.5"/>
      <circle cx="62" cy="18" r="1" fill="#c8b894" opacity="0.4"/>
    </pattern>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c88b34"/><stop offset="1" stop-color="#7d3f1c"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#7b6648" flood-opacity="0.25"/></filter>
  </defs>
  <rect width="900" height="1260" fill="url(#paper)"/>
  <rect x="28" y="28" width="844" height="1204" fill="none" stroke="#b49a6d" stroke-width="2"/>
