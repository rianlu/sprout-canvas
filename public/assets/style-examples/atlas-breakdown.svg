    <g transform="translate(220 910)"><rect width="110" height="74" fill="#f7efdf" stroke="#c8ae7b"/><text x="55" y="100" text-anchor="middle">② 木构梁柱</text></g>
    <g transform="translate(360 910)"><rect width="110" height="74" fill="#f7efdf" stroke="#c8ae7b"/><text x="55" y="100" text-anchor="middle">③ 屋顶铺瓦</text></g>
    <g transform="translate(500 910)"><rect width="110" height="74" fill="#f7efdf" stroke="#c8ae7b"/><text x="55" y="100" text-anchor="middle">④ 彩画装饰</text></g>
    <g transform="translate(640 910)"><rect width="110" height="74" fill="#f7efdf" stroke="#c8ae7b"/><text x="55" y="100" text-anchor="middle">⑤ 礼制陈设</text></g>
