    <rect x="25" y="110" width="205" height="70" fill="#b75a25"/>
    <path d="M-35 130 Q128 36 290 130 Z" fill="url(#roof)" stroke="#5c2e1a" stroke-width="4"/>
    <path d="M-12 132h280" stroke="#e4b65a" stroke-width="8"/>
    <g fill="#e5c27a"><rect x="22" y="170" width="24" height="130"/><rect x="82" y="170" width="24" height="130"/><rect x="148" y="170" width="24" height="130"/><rect x="210" y="170" width="24" height="130"/></g>
    <rect x="65" y="220" width="125" height="80" fill="#4a2217"/>
