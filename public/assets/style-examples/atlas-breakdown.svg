  <rect x="64" y="1066" width="772" height="34" fill="#6f4b2f"/><text x="450" y="1089" fill="#fff" font-family="sans-serif" font-size="17" text-anchor="middle" font-weight="700">核心特征总结</text>
  <g font-family="sans-serif" fill="#4a3524" text-anchor="middle">
    <circle cx="155" cy="1158" r="30" fill="#f7efdf" stroke="#c8ae7b"/><text x="155" y="1210" font-size="14">中轴对称</text>
    <circle cx="300" cy="1158" r="30" fill="#f7efdf" stroke="#c8ae7b"/><text x="300" y="1210" font-size="14">红墙金瓦</text>
    <circle cx="445" cy="1158" r="30" fill="#f7efdf" stroke="#c8ae7b"/><text x="445" y="1210" font-size="14">礼制空间</text>
    <circle cx="590" cy="1158" r="30" fill="#f7efdf" stroke="#c8ae7b"/><text x="590" y="1210" font-size="14">材质层次</text>
    <circle cx="735" cy="1158" r="30" fill="#f7efdf" stroke="#c8ae7b"/><text x="735" y="1210" font-size="14">文化象征</text>
