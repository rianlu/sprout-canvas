    <rect x="64" y="222" width="190" height="36" fill="#6f4b2f"/><text x="159" y="246" fill="#fff" text-anchor="middle" font-weight="700">结构拆解</text>
    <g transform="translate(70 284)"><rect width="160" height="82" fill="#f7efdf" stroke="#c8ae7b"/><path d="M20 52h118l-15-24H36z" fill="#b87126"/><text x="0" y="112">重檐屋顶</text><text x="0" y="136" font-size="12" fill="#7b6346">层级秩序与皇家礼制</text></g>
    <g transform="translate(70 438)"><rect width="160" height="82" fill="#f7efdf" stroke="#c8ae7b"/><rect x="28" y="28" width="104" height="40" fill="#963b26"/><text x="0" y="112">宫门立面</text><text x="0" y="136" font-size="12" fill="#7b6346">红墙金瓦与中轴对称</text></g>
    <g transform="translate(70 592)"><rect width="160" height="82" fill="#f7efdf" stroke="#c8ae7b"/><circle cx="80" cy="42" r="30" fill="#5e4b35"/><text x="0" y="112">铜鼎器物</text><text x="0" y="136" font-size="12" fill="#7b6346">礼仪陈设与历史质感</text></g>
  </g>

