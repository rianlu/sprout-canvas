    <g transform="translate(640 438)"><rect width="70" height="54" fill="#c8b58d"/><path d="M5 45c20-36 38 8 60-30" stroke="#7e6b4e" fill="none"/><text x="86" y="22">汉白玉</text><text x="86" y="45" font-size="12" fill="#7b6346">浮雕栏板, 细密纹理</text></g>

    <rect x="636" y="548" width="200" height="36" fill="#6f4b2f"/><text x="736" y="572" fill="#fff" text-anchor="middle" font-weight="700">纹样 / 色彩 / 寓意</text>
