    <g transform="translate(640 704)"><rect width="182" height="72" fill="#f7efdf" stroke="#c8ae7b"/><path d="M20 48c25-42 55-42 80 0s55 42 80 0" stroke="#315f58" stroke-width="4" fill="none"/><text x="0" y="104" font-size="12" fill="#7b6346">龙纹、云纹、如意纹寓意秩序与祥瑞</text></g>
