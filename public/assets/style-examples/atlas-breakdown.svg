  <rect x="64" y="842" width="772" height="34" fill="#6f4b2f"/><text x="450" y="865" fill="#fff" font-family="sans-serif" font-size="17" text-anchor="middle" font-weight="700">穿着顺序 / 构成流程图</text>
  <g font-family="sans-serif" font-size="13" fill="#4a3524">
