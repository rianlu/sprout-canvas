  <text x="450" y="144" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#6d4b2e">中国明清皇家宫殿 · 世界文化遗产</text>
  <text x="450" y="178" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#7b6346">以图鉴方式拆解主体结构、材质工艺、纹样寓意与核心特征</text>

  <g transform="translate(328 302)" filter="url(#shadow)">
