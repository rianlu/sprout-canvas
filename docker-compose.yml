services:
  sprout-canvas:
    container_name: sprout-canvas
    build: .
    ports:
      - "8888:8787"
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      HOST: 0.0.0.0
    restart: unless-stopped
    stop_grace_period: 460s
